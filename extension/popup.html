<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>CareerOS AI & CDP Agent</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <div class="logo">
        <div class="badge">COS</div>
        <div>
          <div class="title">CareerOS CDP Agent</div>
          <div id="connection" class="muted">checking…</div>
        </div>
      </div>
    </header>

    <main>
      <section id="not-connected" hidden>
        <p class="muted">Sign in to CareerOS in your browser, then click <strong>Connect Extension</strong>.</p>
        <button id="open-app" class="primary">Open CareerOS</button>
      </section>

      <section id="connected" hidden>
        <div id="page-info" class="card">
          <div class="flex-between">
            <span class="muted">Active Job Page</span>
            <span id="ats-badge" class="badge-ats">Detecting…</span>
          </div>
          <div id="job-title-line" class="job-title-display">Scanning page...</div>
          <div id="page-url" class="mono muted small"></div>
        </div>

        <div class="section-title">1. Job Discovery & Pipeline</div>
        <button id="import-job" class="primary import-btn">📥 Capture & Import Job to CareerOS</button>

        <div class="section-title">2. Auto-Apply & Forms</div>
        <button id="cdp-autofill" class="primary cdp-btn">⚡ Autofill with CDP Agent</button>
        <div class="action-row">
          <button id="autofill" class="secondary">Fast DOM Fill</button>
          <button id="scan" class="ghost">Scan Fields</button>
        </div>

        <div id="status" class="status" hidden></div>

        <details open>
          <summary>Agent Activity Stream</summary>
          <ul id="log"></ul>
        </details>
      </section>
    </main>

    <footer>
      <button id="disconnect" class="link" hidden>Disconnect</button>
      <span class="muted small">CDP Agent v0.2.0</span>
    </footer>

    <script src="popup.js"></script>
  </body>
</html>
